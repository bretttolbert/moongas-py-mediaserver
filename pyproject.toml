[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaserver"
version = "1.0.0"
requires-python = ">=3.11"
authors = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
maintainers = [{ name = "Brett Tolbert", email = "bretttolbert@gmail.com" }]
description = "A Flask web application for browsing and playing a media library."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["moongas", "mediaserver", "music", "media", "flask"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "Flask>=3.1.3",
  "Flask-JSGlue @ git+https://github.com/bretttolbert/Flask-JSGlue.git",
  "mediascan @ git+https://github.com/bretttolbert/moongas-py-mediascan.git",
  "dataclass-wizard>=0.39.1",
  "numpy>=2.5.3",
  "pandas>=3.0.5",
  "pyaml>=25.7.0",
  "PyYAML>=6.0.3",
  "SQLAlchemy>=2.0.46",
]

[project.scripts]
mediaserver = "run:main"

[project.urls]
Homepage = "https://github.com/bretttolbert/moongas-py-mediaserver"
Documentation = "https://github.com/bretttolbert/moongas-py-mediaserver"
Repository = "https://github.com/bretttolbert/moongas-py-mediaserver.git"
"Bug Tracker" = "https://github.com/bretttolbert/moongas-py-mediaserver/issues"

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*", "static/**/*"]
